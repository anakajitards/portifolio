  <circle cx="610" cy="310" r="35" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="610" y="316" font-family="'Space Mono', monospace" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">VG</text>
  <text x="610" y="410" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="600" fill="#111111" text-anchor="middle">N° 08 / ESSENCE</text>
  
  <!-- Poster in background -->
  <rect x="770" y="130" width="220" height="400" fill="#D3D0C6" stroke="#111111" stroke-width="1"/>
