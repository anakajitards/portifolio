  <text x="800" y="200" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#111111">04</text>
  <text x="800" y="320" font-family="'Space Mono', monospace" font-size="12" fill="#5F5E5A">ART DIRECTION &amp; PACKAGING SYSTEM</text>

  <!-- Editorial Top & Bottom Meta -->
  <text x="80" y="70" font-family="'Space Mono', monospace" font-size="14" fill="#5F5E5A">PROJETO 04 // DIREÇÃO DE ARTE &amp; EMBALAGENS</text>
  <text x="1120" y="70" font-family="'Space Mono', monospace" font-size="14" fill="#E63B1E" text-anchor="end">EDIÇÃO LIMITADA</text>
  
  <text x="80" y="650" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#111111">VANGUARD SERIES</text>
