      <stop offset="0%" stop-color="#E8E2D8"/>
      <stop offset="100%" stop-color="#D9CFBF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#p4Grad)"/>
  
  <!-- Packaging Design Showcase Mockup -->
  <!-- Box 1 -->
  <rect x="250" y="150" width="200" height="380" fill="#181818" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.12))"/>
  <rect x="270" y="190" width="160" height="18" fill="#E63B1E"/>
  <text x="270" y="320" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">VANGUARD</text>
  <text x="270" y="345" font-family="'Space Mono', monospace" font-size="10" fill="#999999">SPECIAL EDITION</text>
  <line x1="270" y1="460" x2="410" y2="460" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Box 2 (white packaging) -->
