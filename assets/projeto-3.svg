<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCE3DE"/>
      <stop offset="100%" stop-color="#C2CECA"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#p3Grad)"/>
  
  <!-- Minimalist Web Browser Window Frame -->
  <rect x="120" y="90" width="560" height="420" rx="4" fill="#FFFFFF" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.06))"/>
  
  <!-- Browser top bar -->
  <line x1="120" y1="130" x2="680" y2="130" stroke="#EEEEEE" stroke-width="1"/>
  <circle cx="145" cy="110" r="4" fill="#E63B1E"/>
  <circle cx="160" cy="110" r="4" fill="#D3D1C8"/>
  <circle cx="175" cy="110" r="4" fill="#D3D1C8"/>
  <rect x="220" y="103" width="360" height="14" rx="2" fill="#F4F3EE"/>
  
  <!-- Webpage mockup content -->
  <text x="160" y="190" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="#111111">ATELIER NORD</text>
  <text x="160" y="215" font-family="'Space Mono', monospace" font-size="11" fill="#777777">ARQUITETURA, INTERIORES &amp; OBJETOS</text>
  
  <rect x="160" y="245" width="220" height="220" fill="#181818"/>
  <rect x="400" y="245" width="240" height="100" fill="#EDEBE4"/>
  <rect x="400" y="365" width="240" height="100" fill="#EDEBE4"/>
  
  <!-- Corner Labels -->
  <text x="50" y="50" font-family="'Space Mono', monospace" font-size="12" fill="#5F5E5A">FIG. 03 // UI/UX &amp; DESENVOLVIMENTO</text>
  <text x="750" y="50" font-family="'Space Mono', monospace" font-size="12" fill="#111111" text-anchor="end">2025</text>
</svg>
