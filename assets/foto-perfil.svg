<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBEAE3"/>
      <stop offset="100%" stop-color="#DDDCD4"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  
  <!-- Subtle Editorial Grid -->
  <line x1="80" y1="0" x2="80" y2="1000" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="1000" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="880" x2="800" y2="880" stroke="#111111" stroke-opacity="0.08" stroke-width="1"/>
  
  <!-- Corner Marks -->
  <path d="M 60,100 L 60,60 L 100,60" fill="none" stroke="#111111" stroke-width="1.5"/>
  <path d="M 740,100 L 740,60 L 700,60" fill="none" stroke="#111111" stroke-width="1.5"/>
  <path d="M 60,900 L 60,940 L 100,940" fill="none" stroke="#111111" stroke-width="1.5"/>
  <path d="M 740,900 L 740,940 L 700,940" fill="none" stroke="#111111" stroke-width="1.5"/>

  <!-- Minimalist Portrait Silhouette -->
  <circle cx="400" cy="420" r="140" fill="#D3D1C8" stroke="#111111" stroke-width="1.5" stroke-opacity="0.3"/>
  <path d="M 220,740 C 220,590 310,540 400,540 C 490,540 580,590 580,740 Z" fill="#D3D1C8" stroke="#111111" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Center Focus Target -->
  <circle cx="400" cy="420" r="10" fill="none" stroke="#E63B1E" stroke-width="1.5"/>
  <line x1="380" y1="420" x2="420" y2="420" stroke="#E63B1E" stroke-width="1.5"/>
  <line x1="400" y1="400" x2="400" y2="440" stroke="#E63B1E" stroke-width="1.5"/>

  <!-- Editorial Meta Labels -->
  <text x="400" y="790" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="1">[ ESPAÇO PARA SUA FOTO ]</text>
  <text x="400" y="820" font-family="'Space Mono', monospace" font-size="13" fill="#5F5E5A" text-anchor="middle" letter-spacing="2">SUBSTITUA POR: assets/foto-perfil.jpg</text>
  <text x="400" y="845" font-family="'Space Mono', monospace" font-size="11" fill="#8C8B85" text-anchor="middle">PROPORÇÃO RECOMENDADA: 4:5 OU 3:4</text>
  
  <text x="80" y="90" font-family="'Space Mono', monospace" font-size="12" fill="#8C8B85">FIG. 01 — RETRATO</text>
  <text x="720" y="90" font-family="'Space Mono', monospace" font-size="12" fill="#E63B1E" text-anchor="end">STATUS: ATIVO</text>
</svg>
